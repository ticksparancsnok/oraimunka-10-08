<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eredmények</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #b7b3a8; color: #1a1814; font-family: "Times New Roman", Times, serif; }
  .oldal { max-width: 840px; margin: 0 auto; padding: 0 12%; background: url("hatter.jpg") repeat; background-size: 100px auto; }
  main { background: #b7b3a8; padding-bottom: 1px; }
  h1 { margin: 0; padding: 14px 0 6px; text-align: center; font-size: 1.3rem; }
  .orn { display: block; width: 90%; margin: 0 auto 14px; }
  h2 { margin: 0; padding: 12px 0; text-align: center; font-size: 1.15rem; background: #6c655d; }
  .foto { display: block; width: 89%; height: auto; margin: 8px auto; }
  .adat { width: 100%; border-collapse: collapse; background: #6c655d; font-size: .72rem; font-weight: bold; }
  .adat td { padding: 3px 2px; border-left: 3px solid #99948a; width: 33.33%; }
  .adat td:first-child { border-left: 0; text-align: left; }
  .adat td:nth-child(2) { text-align: center; }
  .adat td:last-child { text-align: right; }
  .adat + h2 { margin-top: 3px; }
</style>
</head>
<body>
  <div class="oldal">
    <main>
      <h1>Eredmények</h1>
      <img class="orn" src="diszites.png" alt="">

      <h2>1. díj</h2>
      <img class="foto" src="dij1.jpg" alt="Palacsinta eperrel és mentával">
      <table class="adat"><tr>
        <td>Alkotás neve: Jupiter</td><td>Elkészítési idő: 11 perc</td><td>Alkotó neve: Filpovics Judit</td>
      </tr></table>

      <h2>2. díj</h2>
      <img class="foto" src="dij2.jpg" alt="Palacsinta cseresznyével és csokoládéval">
      <table class="adat"><tr>
        <td>Alkotás neve: Négy évszak</td><td>Elkészítési idő: 7 perc</td><td>Alkotó neve: Spender Károly</td>
      </tr></table>

      <h2>3. díj</h2>
      <img class="foto" src="dij3.jpg" alt="Gyümölcsös palacsinta kék tányéron">
      <table class="adat"><tr>
        <td>Alkotás neve: Gyümölcsbomba</td><td>Elkészítési idő: 8 perc</td><td>Alkotó neve: Kleininger Adél</td>
      </tr></table>
    </main>
  </div>
</body>
</html>
